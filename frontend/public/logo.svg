<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>

    <!-- Needle/road glow: radiates from center in the road direction -->
    <linearGradient id="needleGlow" x1="20" y1="20" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FF6200" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FF6200" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Back hill: very faint, recedes into background -->
    <linearGradient id="hillBack" x1="27" y1="13" x2="27" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FF6200" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FF6200" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Front hill: solid at peak, fades at base — lets road show through below -->
    <linearGradient id="hillFront" x1="16" y1="8" x2="16" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FF6200" stop-opacity="0.9"/>
      <stop offset="55%"  stop-color="#E85800" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C44800" stop-opacity="0.35"/>
    </linearGradient>

    <clipPath id="clip">
      <circle cx="20" cy="20" r="16.5"/>
    </clipPath>

  </defs>

  <!-- Radar rings -->
  <circle cx="20" cy="20" r="16"   stroke="#2C2C34" stroke-width="1.2" fill="none"/>
  <circle cx="20" cy="20" r="10.5" stroke="#2C2C34" stroke-width="1.2" fill="none"/>
  <circle cx="20" cy="20" r="5"    stroke="#2C2C34" stroke-width="1.2" fill="none"/>

  <g clip-path="url(#clip)">

    <!-- Sweep glow wedge in road direction (lower-right, ~40°) -->
    <path d="M20,20 L33.86,28 A16,16 0 0 1 27.5,34.9 Z"
      fill="url(#needleGlow)"/>

    <!--
      THE ROAD AS RADAR NEEDLE
      ────────────────────────
      Originates at radar center (20,20) — exactly like a needle pivot.
      Tapers: zero-width at center, ~4 px at the far edge (perspective).
      A gentle single arc (not S-curve) — reads clearly as a needle sweep.
      Road direction: ~42° below horizontal → lower-right, matching the glow wedge.

      Left edge  (uphill/inner side): M20,20 C20,24 25,29 30,33
      Right edge (downhill/outer):    M20,20 C25,19 31,23 34,28

      Filled by tracing left forward, then right reversed back to origin.
    -->
    <path d="M20,20 C20,24 25,29 30,33 L34,28 C31,23 25,19 20,20 Z"
      fill="#08080f"/>

    <!-- Road shoulder lines — barely-there, like white edge markings -->
    <path d="M20,20 C20,24 25,29 30,33"
      stroke="#F2EDE4" stroke-width="0.3" stroke-opacity="0.22"
      stroke-linecap="round" fill="none"/>
    <path d="M20,20 C25,19 31,23 34,28"
      stroke="#F2EDE4" stroke-width="0.3" stroke-opacity="0.22"
      stroke-linecap="round" fill="none"/>

    <!-- Orange center-line dashes — road markings, will show subtly through hill -->
    <path d="M20,20 C22,22 28,26 32,31"
      stroke="#FF6200" stroke-width="0.65" stroke-dasharray="2,1.6"
      stroke-linecap="round" fill="none"/>

    <!-- Back hill (drawn after road — road is fully behind) -->
    <path d="M11,38 L27,13 L42,38 Z" fill="url(#hillBack)"/>

    <!-- Front hill (semi-transparent gradient — road needle visible as dark groove underneath) -->
    <path d="M1,38 L16,8 L33,38 Z" fill="url(#hillFront)"/>

    <!-- Ridge line: bright crest tracing the hill silhouette -->
    <path d="M1,38 L16,8 L33,38"
      stroke="#FF8040" stroke-width="0.9"
      stroke-linejoin="round" stroke-linecap="round" fill="none"/>

  </g>

  <!-- Radar center dot — the needle pivot, always on top -->
  <circle cx="20" cy="20" r="1.3" fill="#FF6200"/>

</svg>
